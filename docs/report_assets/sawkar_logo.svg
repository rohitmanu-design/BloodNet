<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 40 35 L 300 35 L 300 130 C 300 175, 170 212, 170 212 C 170 212, 40 175, 40 130 Z" 
        fill="#ffffff" stroke="#a31920" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Inner Shield Inset Line -->
  <path d="M 47 42 L 293 42 L 293 128 C 293 168, 170 203, 170 203 C 170 203, 47 168, 47 128 Z" 
        fill="none" stroke="#a31920" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Top Banner (SET) -->
  <path d="M 85 10 L 255 10 C 265 10, 270 16, 268 25 L 265 42 L 75 42 L 72 25 C 70 16, 75 10, 85 10 Z" 
        fill="#a31920" stroke="#7e1117" stroke-width="1.5" />
  
  <text x="170" y="32" 
        font-family="'Times New Roman', Times, serif" 
        font-size="16" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="3.5">★  SET  ★</text>

  <!-- Central Plaque Background -->
  <rect x="48" y="46" width="244" height="74" fill="#ffffff" />
  
  <!-- Red Top & Bottom Double Stripes for SAWKAR INSTITUTES -->
  <line x1="52" y1="48" x2="288" y2="48" stroke="#a31920" stroke-width="2.5" />
  <line x1="52" y1="52" x2="288" y2="52" stroke="#a31920" stroke-width="1" />

  <!-- SAWKAR Main Text -->
  <text x="170" y="86" 
        font-family="'Arial Black', Impact, 'Times New Roman', sans-serif" 
        font-size="33" 
        font-weight="900" 
        font-style="italic" 
        fill="#a31920" 
        text-anchor="middle" 
        letter-spacing="2">SAWKAR</text>

  <!-- INSTITUTES Subtitle -->
  <text x="170" y="112" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="#a31920" 
        text-anchor="middle" 
        letter-spacing="5.5">INSTITUTES</text>

  <line x1="52" y1="118" x2="288" y2="118" stroke="#a31920" stroke-width="1" />
  <line x1="52" y1="122" x2="288" y2="122" stroke="#a31920" stroke-width="2.5" />

  <!-- Lower Ribbon / Chevrons for SATARA -->
  <path d="M 85 125 L 255 125 L 235 158 L 105 158 Z" fill="#a31920" />
  <text x="170" y="148" 
        font-family="'Arial', sans-serif" 
        font-size="14.5" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="4">SATARA</text>

  <!-- Pointed Base for 1986 -->
  <path d="M 120 162 L 220 162 L 170 198 Z" fill="#7e1117" />
  <text x="170" y="182" 
        font-family="'Times New Roman', serif" 
        font-size="13" 
        font-weight="bold" 
        fill="#ffd700" 
        text-anchor="middle" 
        letter-spacing="1.5">1986</text>
</svg>
